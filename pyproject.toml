[project]
name = "compdoc"
version = "0.1.0"
description = "Agentic trader compensation contract extractor (Docling + Claude + LangGraph)"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.70",
    "langgraph>=0.6",
    "langgraph-checkpoint-sqlite>=2.0",
    "pydantic>=2.8",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "docling>=2.40",
    "rank-bm25>=0.2.2",
    "python-docx>=1.1",
    "reportlab>=4.2",
    "pypdfium2>=4.30",
    "pillow>=10.0",
    "structlog>=24.1",
    "typer>=0.12",
    "rich>=13.7",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "streamlit>=1.38",
    "mcp>=1.10",
    "openai>=3.41.0",
    "ocrmac>=1.0.1",
]

[project.scripts]
compdoc = "compdoc.cli:app"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/compdoc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
